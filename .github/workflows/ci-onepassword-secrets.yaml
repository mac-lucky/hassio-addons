name: 1Password Secrets CI/CD

# Not triggered by pushes or pull requests directly: ci.yaml calls this when
# onepassword_secrets/ changes, so every pull request reports one gate check
# whatever it touches.
on:
  # release-onepassword-secrets.yaml calls this on a tag, which is the only way the
  # images ever reach GHCR. Branch and pull request runs build every
  # architecture and throw the result away, so a Dockerfile that cannot build
  # still fails before it is tagged.
  workflow_call:
    inputs:
      publish:
        description: Push the built images to GHCR.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  ADDON_SLUG: onepassword_secrets
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz. Release assets are
  # mutable, so the version pin alone has no integrity; when Renovate bumps the
  # version this must be updated by hand from the release checksums file, and
  # until it is the secret-scan job fails, keeping the bump from automerging.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  information:
    name: Gather Information
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_date: ${{ steps.info.outputs.build_date }}
      description: ${{ steps.info.outputs.description }}
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      go_version: ${{ steps.info.outputs.go_version }}
      connect_version: ${{ steps.info.outputs.connect_version }}
      base_images: ${{ steps.info.outputs.base_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get add-on information
        id: info
        run: |
          architectures=$(yq -o=json -I=0 '.arch' onepassword_secrets/config.yaml)
          echo "architectures=${architectures}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "description=$(yq -r '.description' onepassword_secrets/config.yaml)" >> $GITHUB_OUTPUT
          echo "name=$(yq -r '.name' onepassword_secrets/config.yaml)" >> $GITHUB_OUTPUT
          echo "version=$(yq -r '.version' onepassword_secrets/config.yaml)" >> $GITHUB_OUTPUT
          echo "go_version=$(yq -r '.args.GO_VERSION' onepassword_secrets/build.yaml)" >> $GITHUB_OUTPUT
          echo "connect_version=$(yq -r '.args.CONNECT_VERSION' onepassword_secrets/build.yaml)" >> $GITHUB_OUTPUT
          echo "base_images=$(yq -o=json -I=0 '.build_from' onepassword_secrets/build.yaml)" >> $GITHUB_OUTPUT

      # config.yaml's version and the Dockerfile's BUILD_VERSION default are
      # two copies of the same number, each carrying a comment pointing at the
      # other. Nothing but this step stops them drifting apart.
      - name: Check version is in sync with the Dockerfile
        run: |
          config_version=$(yq -r '.version' onepassword_secrets/config.yaml)
          docker_version=$(sed -n 's/^ARG BUILD_VERSION=//p' onepassword_secrets/Dockerfile)
          if [ "${config_version}" != "${docker_version}" ]; then
            echo "config.yaml version (${config_version}) != Dockerfile BUILD_VERSION (${docker_version})" >&2
            exit 1
          fi
          echo "both say ${config_version}"

  lint-addon:
    name: Addon Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run addon lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: "./onepassword_secrets"

  lint-hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: onepassword_secrets/Dockerfile
          failure-threshold: warning
          ignore: DL3018

  lint-yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # line-length is off rather than raised: translations/en.yaml holds the
      # option descriptions Home Assistant renders in the config form, and
      # those are prose paragraphs on a single line by design.
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: onepassword_secrets/
          config_data: |
            extends: default
            rules:
              line-length: disable
              truthy:
                allowed-values: ['true', 'false', 'on', 'off']
              comments:
                min-spaces-from-content: 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The tests push fake values through every code path to prove none
      # leaks. .gitleaks.toml allowlists them by pattern, not by excluding
      # test files, so a real credential in a test still fails here.
      - name: Run gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir onepassword_secrets \
            --config onepassword_secrets/.gitleaks.toml \
            --redact --no-banner --exit-code 1

  test-go:
    name: Go Test
    needs:
      - information
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onepassword_secrets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.information.outputs.go_version }}
          cache-dependency-path: onepassword_secrets/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "gofmt would change these files:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      # The panel's preview fixtures only compile under -tags dev, so the
      # lane above never sees them. See internal/web/dev.go.
      - name: Test (dev tag)
        run: go test -race -tags dev ./internal/web/

  lint-go:
    name: golangci-lint
    needs:
      - information
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.information.outputs.go_version }}
          cache-dependency-path: onepassword_secrets/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: onepassword_secrets

  build:
    name: Build (${{ matrix.architecture }})
    needs:
      - information
      - lint-addon
      - lint-hadolint
      - lint-yaml
      - secret-scan
      - test-go
      - lint-go
    # aarch64 builds on a native arm runner: the Dockerfile compiles the Go
    # binary from source, and doing that under QEMU on ubuntu-latest was the
    # slowest job in the fleet whenever the layer cache went cold.
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJson(needs.information.outputs.architectures) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Both declared architectures run on native runners; QEMU would only be
      # needed if an emulated arch were ever added to the platform case below.
      - name: Set up QEMU
        if: ${{ matrix.architecture != 'amd64' && matrix.architecture != 'aarch64' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set platform
        id: platform
        env:
          ARCH: ${{ matrix.architecture }}
        run: |
          case "${ARCH}" in
            amd64) platform="linux/amd64" ;;
            aarch64) platform="linux/arm64" ;;
          esac
          echo "platform=${platform}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # A release never reuses layers: the apk/apt upgrade layer is only as
          # fresh as the build that produced it, and a cached one shipped the
          # base image's OpenSSL under a new add-on version. Branch and PR
          # builds keep the cache.
          no-cache: ${{ inputs.publish || false }}
          context: onepassword_secrets
          file: onepassword_secrets/Dockerfile
          platforms: ${{ steps.platform.outputs.platform }}
          push: ${{ inputs.publish || false }}
          # Branch and PR builds load the image for the smoke test below.
          load: ${{ !inputs.publish }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/hassio-addon-onepassword-secrets-${{ matrix.architecture }}:${{ needs.information.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/hassio-addon-onepassword-secrets-${{ matrix.architecture }}:latest
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ needs.information.outputs.build_date }}
            BUILD_DESCRIPTION=${{ needs.information.outputs.description }}
            BUILD_FROM=${{ fromJSON(needs.information.outputs.base_images)[matrix.architecture] }}
            BUILD_NAME=${{ needs.information.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.information.outputs.version }}
            GO_VERSION=${{ needs.information.outputs.go_version }}
            CONNECT_VERSION=${{ needs.information.outputs.connect_version }}
            PKG_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=build-onepassword-secrets-${{ matrix.architecture }}
          cache-to: type=gha,scope=build-onepassword-secrets-${{ matrix.architecture }},mode=max
          labels: |
            org.opencontainers.image.title=${{ needs.information.outputs.name }}
            org.opencontainers.image.description=${{ needs.information.outputs.description }}
            org.opencontainers.image.created=${{ needs.information.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.information.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # The Connect binaries come from another image and are linked against
      # glibc: prove they load and start on this base, and that the add-on
      # binary runs and refuses a missing options file.
      - name: Smoke test the image
        if: ${{ !inputs.publish }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/hassio-addon-onepassword-secrets-${{ matrix.architecture }}:${{ needs.information.outputs.version }}
        run: |
          docker run --rm --entrypoint /bin/sh "${IMAGE}" -c '
            set -e
            mkdir -p /tmp/c && echo "{}" > /tmp/c/creds.json
            for bin in connect-api connect-sync; do
              out=$(XDG_DATA_HOME=/tmp/c OP_SESSION=/tmp/c/creds.json OP_HTTP_PORT=18080 OP_BUS_PORT=11299 timeout 4 /usr/local/bin/${bin} 2>&1 || true)
              echo "${out}" | head -3
              echo "${out}" | grep -q "log_message" || { echo "${bin} did not start" >&2; exit 1; }
            done
            out=$(/onepassword-secrets 2>&1 || true)
            echo "${out}"
            echo "${out}" | grep -q "invalid add-on options" || { echo "add-on binary did not run" >&2; exit 1; }
          '
