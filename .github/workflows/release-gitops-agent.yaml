name: GitOps Agent Release

# Publishing is tag-gated. Merging to main only builds and tests, so the
# version in config.yaml can land ahead of the images it names; pushing
# ha_gitops_agent/vX.Y.Z is what puts them on GHCR and cuts the release.
#
# The tag carries a "v" and a slash because
# actions-shared-workflows/generate-release-notes finds the previous tag with
# --match "<prefix>/v*". A tag shaped any other way makes every release read
# as the first one.
#
# Dispatching this against an existing tag re-runs the same release, which is
# the way to recover a publish that failed halfway without moving the tag.
on:
  push:
    tags:
      - "ha_gitops_agent/v*"
  workflow_dispatch:

jobs:
  verify:
    name: Verify Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # config.yaml is where the published image tag comes from, and the store
      # entry Home Assistant reads. A tag naming a different version would
      # publish an image nobody can install.
      - name: Check the tag matches config.yaml
        run: |
          tag_version="${GITHUB_REF_NAME#ha_gitops_agent/v}"
          config_version=$(yq -r '.version' ha_gitops_agent/config.yaml)
          if [ "${tag_version}" != "${config_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match config.yaml version (${config_version})" >&2
            exit 1
          fi
          echo "both say ${config_version}"

  ci:
    name: CI
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-gitops-agent.yaml
    with:
      publish: true

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the notes are the commits since the previous tag, and a
      # shallow clone cannot see it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: mac-lucky/actions-shared-workflows/.github/actions/generate-release-notes@master
        with:
          tag: ${{ github.ref_name }}
          path_filter: ./ha_gitops_agent

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "GitOps Agent ${GITHUB_REF_NAME#ha_gitops_agent/v}" \
            --notes-file release-notes.md
