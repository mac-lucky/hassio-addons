name: Auto Release

# Releases the add-ons without a tag pushed by hand, in two steps.
#
# A push to main that changes an add-on's config.yaml tags the version it
# names (`<slug>/vX.Y.Z`) when that tag does not exist yet, which starts the
# add-on's release-*.yaml: merging a version bump is the release. A version
# older than the add-on's newest tag is not tagged, and neither is an add-on
# with no tag at all: its first release is cut by hand
# (.github/scripts/tag-versions.sh).
#
# A dispatch with `images` (GHCR package names, e.g. "hassio-addon-vector-amd64
# hassio-addon-vector-aarch64") releases each add-on those images belong to
# again (.github/scripts/rebuild-bump.py). The Supervisor only offers an
# update for a new version, so a rebuild has to be one: each add-on gets its
# own pull request (`auto-release/rebuild-<slug>`) that bumps the patch
# version and adds a CHANGELOG entry, and its merge is the push above. A pure
# rebuild turns on auto-merge, with CI as the gate. One that would also ship
# changes merged since the last release (an [Unreleased] section, commits
# since the tag) waits for a person to read the entry and merge it. An
# add-on whose config.yaml names a version that was never tagged gets that
# tag instead: its release builds fresh as well.
#
# The nightly GHCR scan in mac-lucky/forgejo-fleet-ops dispatches it this way
# when a rebuild alone would clear an image's findings, and finds its own runs
# again by the run name. It dispatches `auto-tag.yml` by that name, hence the
# .yml.
#
# Both jobs write with a mac-lucky-ci GitHub App token: a tag or a pull
# request made with github.token starts no workflow.

run-name: ${{ inputs.images && format('rebuild {0}', inputs.images) || '' }}

on:
  push:
    branches: [main]
    paths:
      - '*/config.yaml'
  workflow_dispatch:
    inputs:
      images:
        description: 'GHCR packages to rebuild, space-separated (hassio-addon-<slug>-<arch>)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag new versions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          # GitHub can refuse an App's tag push over the workflow files the
          # tagged commit carries unless the token may write workflows.
          permission-workflows: write

      - name: Checkout
        # zizmor: ignore[artipacked] the tag push below authenticates with this persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags: each version is checked against the
          # add-on's newest tag.
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Tag each version that has no tag
        run: .github/scripts/tag-versions.sh

  rebuild:
    name: Release the images again
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # A force push onto a branch whose old commit predates workflow
          # changes on main, and a tag over a commit carrying workflows, are
          # both refused to an App without it.
          permission-workflows: write

      - name: Checkout
        # zizmor: ignore[artipacked] the branch and tag pushes below authenticate with this persisted token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags and history: the plan compares each version with the
          # add-on's newest tag, and the CHANGELOG entry lists the commits
          # since it.
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Plan
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          read -r -a images <<<"$IMAGES"
          python3 .github/scripts/rebuild-bump.py plan "${images[@]}" > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"

      - name: Tag or open a pull request per add-on
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IMAGES: ${{ inputs.images }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          while read -r slug action; do
            case "$action" in
              # The tag goes on the commit this run checked out, never on
              # another add-on's bump branch.
              tag) git switch -q --detach "$base"; .github/scripts/tag-versions.sh "$slug"; continue ;;
              bump) ;;
              *) continue ;;
            esac
            branch="auto-release/rebuild-${slug}"
            git switch -q -C "$branch" "$base"
            python3 .github/scripts/rebuild-bump.py bump "$slug" > "$RUNNER_TEMP/bump"
            title=$(sed -n 's/^title=//p' "$RUNNER_TEMP/bump")
            functional=$(sed -n 's/^functional=//p' "$RUNNER_TEMP/bump")
            git add -A -- "$slug"
            git commit -q -m "$title"
            # One branch per add-on: a dispatch while its last pull request is
            # still open replaces that commit.
            git push -q --force origin "HEAD:refs/heads/${branch}"
            if [ "$functional" = true ]; then
              note="This also ships the changes merged since the last ${slug} release (see its CHANGELOG entry), so it waits for a person: check the entry and merge it."
            else
              note="Rebuild only. Auto-merge is on."
            fi
            printf 'Rebuild of %s, opened by [auto-tag.yml](%s).\n\n%s The merge tags the new version, which publishes it.\n' \
              "$IMAGES" "$RUN_URL" "$note" > "$RUNNER_TEMP/body.md"
            open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              gh pr edit "$open" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            else
              gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            fi
            if [ "$functional" = true ]; then
              # An open pull request from an earlier, pure rebuild may have it on.
              gh pr merge "$branch" --disable-auto > /dev/null 2>&1 || true
              echo "::warning::$slug: the rebuild pull request carries unreleased changes; merge it by hand"
            else
              gh pr merge "$branch" --auto --squash
            fi
          done < "$RUNNER_TEMP/plan"
