name: 1Password Secrets Release

# Publishing is tag-gated. Merging to main only builds and tests, so the
# version in config.yaml can land ahead of the images it names; pushing
# onepassword_secrets/vX.Y.Z is what puts them on GHCR and cuts the release.
#
# The tag carries a "v" and a slash because
# actions-shared-workflows/generate-release-notes finds the previous tag with
# --match "<prefix>/v*". A tag shaped any other way makes every release read
# as the first one.
#
# Dispatching this against an existing tag re-runs the same release, which is
# the way to recover a publish that failed halfway without moving the tag. A
# dispatch reads the workflow from the ref it is handed, so this only works on
# a tag whose commit already carries this file; anything older is a 422 and has
# to be released by hand.
on:
  push:
    tags:
      - "onepassword_secrets/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # config.yaml is where the published image tag comes from, and the store
      # entry Home Assistant reads. A tag naming a different version would
      # publish an image nobody can install.
      - name: Check the tag matches config.yaml
        run: |
          tag_version="${GITHUB_REF_NAME#onepassword_secrets/v}"
          config_version=$(yq -r '.version' onepassword_secrets/config.yaml)
          if [ "${tag_version}" != "${config_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match config.yaml version (${config_version})" >&2
            exit 1
          fi
          echo "both say ${config_version}"

  ci:
    name: CI
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-onepassword-secrets.yaml
    with:
      publish: true

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: the notes are the commits since the previous tag, and a
      # shallow clone cannot see it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: mac-lucky/actions-shared-workflows/.github/actions/generate-release-notes@master
        with:
          tag: ${{ github.ref_name }}
          path_filter: ./onepassword_secrets

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "1Password Secrets ${GITHUB_REF_NAME#onepassword_secrets/v}" \
            --notes-file release-notes.md
