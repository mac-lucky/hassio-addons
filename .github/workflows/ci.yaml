name: CI

# Runs on every push and pull request, so each one reports the same "All
# checks passed" check and branch protection can require it. The add-on
# pipelines themselves live in ci-vector.yaml and ci-gitops-agent.yaml and
# run only when their add-on changes; a skipped add-on counts as passing.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      vector: ${{ steps.diff.outputs.vector }}
      gitops_agent: ${{ steps.diff.outputs.gitops_agent }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A push is diffed against its "before" commit, which can be several
          # commits back.
          fetch-depth: 0
          persist-credentials: false

      - name: Diff against the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A pull request checks out its merge commit, whose first parent is
          # the base branch tip. A dispatch, or a push whose "before" commit is
          # unknown (all zeros, or gone after a force push), runs everything.
          all=false
          files=""
          case "${EVENT}" in
            pull_request) files=$(git diff --name-only HEAD^1 HEAD) ;;
            push)
              if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                files=$(git diff --name-only "${BEFORE}" HEAD)
              else
                all=true
              fi
              ;;
            *) all=true ;;
          esac
          echo "all=${all}"
          echo "${files}"

          changed() { [ "${all}" = true ] || grep -Eq "$1" <<<"${files}"; }

          vector=false
          changed '^(vector/|\.github/workflows/(ci|ci-vector)\.yaml$)' && vector=true
          echo "vector=${vector}" >> "${GITHUB_OUTPUT}"

          gitops_agent=false
          changed '^(ha_gitops_agent/|\.github/workflows/(ci|ci-gitops-agent)\.yaml$)' && gitops_agent=true
          echo "gitops_agent=${gitops_agent}" >> "${GITHUB_OUTPUT}"

          cat "${GITHUB_OUTPUT}"

  # The build jobs inside both pipelines declare packages: write (they push on
  # a release), and a called workflow cannot be granted more than its caller.
  vector:
    name: Vector
    needs: changes
    if: needs.changes.outputs.vector == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-vector.yaml

  gitops-agent:
    name: GitOps Agent
    needs: changes
    if: needs.changes.outputs.gitops_agent == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-gitops-agent.yaml

  # Branch protection requires this one name. The add-on jobs are named per
  # architecture and per tool, so no rule could list them.
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - vector
      - gitops-agent
    if: ${{ always() }}
    steps:
      # skipped counts as a pass: most pull requests touch one add-on or
      # neither, and the other pipeline does not run.
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::one or more jobs failed or were cancelled"
          exit 1
