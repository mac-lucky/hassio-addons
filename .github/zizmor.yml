# zizmor settings, read by zizmor itself and by the fleet's weekly workflow
# sweep.
rules:
  unpinned-uses:
    config:
      policies:
        # First-party reusable workflows and actions ride @master by design.
        mac-lucky/*: any
  # The suggested `uses: $/...` form is rejected by actionlint 1.7.12, so the
  # in-repo workflow calls keep `./`.
  self-repository:
    disable: true
