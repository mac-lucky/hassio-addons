# Grype ignore rules for the images this repository publishes, appended to the
# org baseline (a bare list, the shape docker-cicd-reusable.yml concatenates).
# The nightly registry scan in forgejo-fleet-ops merges it for every image whose
# org.opencontainers.image.source label points here.
#
# Each rule is scoped by location so it only ever matches the binary named.
# Nothing here is compiled by this repo: the findings are the Go standard
# library and modules those upstream builds vendored, and they change only when
# the upstream project (or the distribution packaging it) ships a new build.
# Drop a rule once that happens.

# tempio: Go binary shipped by hassio-addons/base and hassio-addons/debian-base.
- package:
    type: go-module
    location: "/usr/bin/tempio"

# sops: installed from the Alpine repository of the base image's release.
- package:
    type: go-module
    location: "/usr/bin/sops"
