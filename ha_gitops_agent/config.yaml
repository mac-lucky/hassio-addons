name: "GitOps Agent"
description: "Sync Home Assistant YAML config from a git repository, with dry-run diff, validate-then-apply, and rollback."
slug: ha_gitops_agent
url: https://github.com/mac-lucky/hassio-addons/tree/main/ha_gitops_agent
# Keep in sync with Dockerfile's ARG BUILD_VERSION default (which has a
# comment pointing back here).
version: "0.6.3"
arch:
  - aarch64
  - amd64
# Prebuilt per architecture by CI and pushed to GHCR. Without this key
# Supervisor builds on the box instead, which downloads a full Go toolchain
# and compiles on every install.
image: ghcr.io/mac-lucky/hassio-addon-ha-gitops-agent-{arch}
startup: services
# boot, ingress_port and panel_admin are omitted deliberately: their defaults
# (auto, 8099, true) are already what this add-on wants, and the add-on
# linter rejects keys that restate a default.
ingress: true
panel_icon: mdi:source-branch
panel_title: GitOps
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
# The ingress dashboard (8099, above) is never exposed here - Supervisor's
# ingress proxy is its only route in. This port is the optional webhook
# trigger (internal/hook); it only actually listens when webhook_secret is
# set, but the mapping has to be declared unconditionally so a user can
# enable it later without reinstalling. Disabled (null) by default.
ports:
  "8098/tcp": null
ports_description:
  "8098/tcp": "Webhook trigger (POST /webhook) - only listens once webhook_secret is set"
options:
  repo_url: ""
  branch: "main"
  git_username: ""
  git_token: ""
  interval_minutes: 5
  dry_run: true
  apply_after_pull: "reload"
  commit_back: false
  allow_import: false
  webhook_secret: ""
  age_key: ""
  auto_update_addons: []
  auto_update_interval_minutes: 360
  track_addon_versions: false
  capture_live_changes: false
  reconcile:
    yaml_files: true
    registries: false
    dashboards: false
    addon_options: false
    integrations: false
    subentries: false
    hacs: false
schema:
  repo_url: str
  branch: str
  git_username: str?
  git_token: password?
  interval_minutes: int(1,1440)
  dry_run: bool
  apply_after_pull: list(reload|restart|off)
  commit_back: bool
  allow_import: bool
  webhook_secret: password?
  age_key: password?
  auto_update_addons:
    - match(^[a-z0-9_-]+$)
  auto_update_interval_minutes: int(15,10080)
  track_addon_versions: bool
  capture_live_changes: bool
  reconcile:
    yaml_files: bool
    registries: bool
    dashboards: bool
    addon_options: bool
    integrations: bool
    subentries: bool
    hacs: bool
