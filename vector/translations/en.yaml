configuration:
  victorialogs_endpoint:
    name: VictoriaLogs Endpoint
    description: >-
      The full URL of the VictoriaLogs Elasticsearch-compatible insert path.
      Example: http://192.168.1.100:9428/insert/elasticsearch
  victorialogs_username:
    name: VictoriaLogs Username
    description: >-
      Username for basic authentication.
      Leave empty if your VictoriaLogs instance does not require auth.
  victorialogs_password:
    name: VictoriaLogs Password
    description: >-
      Password for basic authentication.
      Only used when a username is set.
  hostname:
    name: Hostname
    description: >-
      Override the host label added to all logs.
      Leave empty to use the host name the journal reports.
  instance:
    name: Instance
    description: >-
      Instance identifier for multi-HA setups.
      This label helps distinguish logs from different Home Assistant instances.
  log_level:
    name: Log Level
    description: >-
      The verbosity level of the add-on's own logging.
      Set to debug or trace for troubleshooting.
  collect_journal:
    name: Collect Journal Logs
    description: >-
      Enable collection of systemd journal logs.
      This includes logs from Home Assistant Core, Supervisor, and add-ons.
  redact_sensitive:
    name: Redact Sensitive Data
    description: >-
      Replace API keys, tokens, passwords and authorization headers found in log
      messages with a placeholder before shipping them.
  journal_include_units:
    name: Journal Include Units
    description: >-
      Only collect logs from these systemd units on the host.
      Leave empty to collect from all units. Core and every add-on run as
      containers under docker.service; pick those with include_containers.
      Example: ["docker.service", "NetworkManager.service"]
  journal_exclude_units:
    name: Journal Exclude Units
    description: >-
      Exclude logs from these systemd units.
      Useful for filtering out noisy services.
      Example: ["systemd-resolved.service", "systemd-timesyncd.service"]
  include_containers:
    name: Include Containers
    description: >-
      Only collect logs from these containers. An entry matches the full
      container name or its ending, so music_assistant matches
      app_d5369777_music_assistant. Leave empty to collect every container.
      Host services, the kernel and the audit log are not affected.
  exclude_containers:
    name: Exclude Containers
    description: >-
      Never collect logs from these containers. Matched the same way as
      Include Containers. Example: ["wmbusmeters-ha-addon"]
  multiline_containers:
    name: Multi-line Containers
    description: >-
      Join multi-line output such as Python tracebacks from these containers
      into one entry. Only for containers whose log lines start with a
      timestamp or a level word. Set to an empty list to turn joining off.
  stream_fields:
    name: Stream Fields
    description: >-
      Fields to use as VictoriaLogs stream identifiers.
      These fields determine how logs are grouped for efficient querying.
  extra_labels:
    name: Extra Labels
    description: >-
      Additional key-value labels to add to all logs.
      Example: {"environment": "production", "location": "home"}
  custom_config_path:
    name: Custom Config Path
    description: >-
      Path to a custom Vector configuration file, under /config (this add-on's
      own config folder, /addon_configs on the host - the recommended place) or
      /share. When set, the add-on will use this config instead of generating
      one, and it will refuse to start if the file is missing.
      Example: /config/custom.yaml
